# The harness has no route to the Internet.  This proxy is its only egress path
# and accepts TLS tunnels only to the official OpenCode API endpoint.
http_port 3128

acl allowed_destination dstdomain opencode.ai
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny CONNECT !SSL_ports
http_access allow allowed_destination
http_access deny all

cache deny all
cache_mem 8 MB
maximum_object_size 0 KB
access_log stdio:/var/spool/squid/access.log
cache_log /var/spool/squid/cache.log
pid_filename none
visible_hostname deepseek-harness-egress
